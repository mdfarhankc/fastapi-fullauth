[project]
name = "fastapi-fullauth"
description = "Production-grade, async-native authentication and authorization library for FastAPI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
  "argon2",
  "async",
  "authentication",
  "authorization",
  "bcrypt",
  "beanie",
  "csrf",
  "fastapi",
  "jwt",
  "mongodb",
  "oauth2",
  "passkey",
  "password-hashing",
  "pydantic",
  "rbac",
  "redis",
  "refresh-token",
  "role-based-access-control",
  "security",
  "sqlalchemy",
  "sqlmodel",
  "tortoise",
  "webauthn",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "argon2-cffi>=25.1.0",
  "fastapi>=0.136.1",
  "pydantic-settings>=2.14.1",
  "pydantic[email]>=2.13.4",
  "pyjwt>=2.12.1",
  "uuid-utils>=0.16.0",
]
dynamic = ["version"]

[project.urls]
Changelog = "https://github.com/mdfarhankc/fastapi-fullauth/blob/main/CHANGELOG.md"
Documentation = "https://mdfarhankc.github.io/fastapi-fullauth"
Homepage = "https://github.com/mdfarhankc/fastapi-fullauth"
Issues = "https://github.com/mdfarhankc/fastapi-fullauth/issues"
Repository = "https://github.com/mdfarhankc/fastapi-fullauth"

[project.scripts]
fullauth = "fastapi_fullauth.cli:main"

[project.optional-dependencies]
bcrypt = ["bcrypt>=4.1.0"]
beanie = ["beanie>=2.0"]
beanie-standard = ["fastapi-fullauth[beanie,bcrypt,redis,oauth,passkey]"]
oauth = ["httpx>=0.28.1"]
passkey = ["webauthn>=2.7.1"]
redis = ["redis>=7.4.0"]
sqlalchemy = ["sqlalchemy[asyncio]>=2.0.49", "alembic>=1.18.4"]
sqlalchemy-standard = ["fastapi-fullauth[sqlalchemy,bcrypt,redis,oauth,passkey]"]
sqlmodel = ["sqlmodel>=0.0.38", "alembic>=1.18.4"]
sqlmodel-standard = ["fastapi-fullauth[sqlmodel,bcrypt,redis,oauth,passkey]"]
tortoise = ["tortoise-orm>=1.0"]
tortoise-standard = ["fastapi-fullauth[tortoise,bcrypt,redis,oauth,passkey]"]

[dependency-groups]
dev = [
  "aiosqlite>=0.22.1",
  "bcrypt>=4.1.0",
  "beanie>=2.0",
  "fakeredis>=2.35.1",
  "httpx>=0.28.1",
  "mkdocs-material>=9.7.6",
  "mongomock-motor>=0.0.36",
  "mypy>=2.1.0",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.13",
  "tortoise-orm>=1.0",
  "tzdata>=2024.1",
  "uvicorn>=0.47.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "fastapi_fullauth/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["fastapi_fullauth"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# Tortoise ORM exposes model relations on the concrete app models, not on the
# abstract mixins the adapter is typed against: the M2M `roles` / `permissions`
# managers and the FK shadow `user_id` are invisible to mypy here, and its query
# kwargs are dynamic. These two codes cover exactly that ORM boundary; every
# other strict check (including no-untyped-def) stays enforced on this file.
module = ["fastapi_fullauth.adapters.tortoise"]
disable_error_code = ["attr-defined", "arg-type"]

[tool.pytest]
filterwarnings = [
  "ignore:In-memory backends in use:UserWarning",
]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
# Keep the formatter off Python snippets embedded in Markdown.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["B008", "B904"]
