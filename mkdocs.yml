site_name: fastapi-fullauth
site_url: https://mdfarhankc.github.io/fastapi-fullauth
site_description: Production-grade, async-native authentication and authorization library for FastAPI.
repo_url: https://github.com/mdfarhankc/fastapi-fullauth
repo_name: mdfarhankc/fastapi-fullauth

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/home.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - llmstxt:
      full_output: llms-full.txt
      # The hook keeps content-tab labels, then runs the plugin's autoclean itself.
      autoclean: false
      preprocess: scripts/llmstxt_preprocess.py
      markdown_description: >-
        FastAPI FullAuth is a pluggable authentication and authorization library for FastAPI.
        It provides JWT access and refresh tokens with rotation and reuse detection (stored as
        sha256 digests), password hashing (Argon2id or bcrypt), email verification and password
        reset flows, OAuth2 social login (Google, GitHub, Discord, GitLab, or custom providers via
        StandardOAuthProvider), passkey (WebAuthn) login, session management, role-based access
        control with permissions, rate limiting, CSRF protection, and security headers middleware.
        Anti-enumeration and timing-attack defenses are on by default. Adapters handle storage
        (SQLModel, SQLAlchemy, Tortoise ORM, or Beanie/MongoDB), backends handle token extraction,
        flows implement auth logic, and composable routers expose the API. Configuration uses
        Pydantic Settings with environment variable support. Custom user schemas are generic,
        including the user primary key type: UUID by default, UserSchema[int] or UserSchema[str]
        otherwise. Source: https://github.com/mdfarhankc/fastapi-fullauth. PyPI:
        https://pypi.org/project/fastapi-fullauth/. Python 3.10 to 3.14, MIT licensed. Coding
        agents can install the Agent Skill with: npx skills add mdfarhankc/fastapi-fullauth
      sections:
        Getting started:
          - index.md: Overview, features, installation, quick start example, route table, and composable routers
          - getting-started.md: Step-by-step setup with user model, database, FullAuth config, FastAPI wiring, and first API calls
          - architecture.md: How the library works internally; adapters, backends, flows, routers, and protection layers
          - configuration.md: All FullAuthConfig options; core, tokens, passwords, login, rate limiting, Redis, blacklist, cookies, OAuth, routing
          - customization.md: Map of every extension point; custom adapters, user schemas, token claims, event hooks, password rules, token transport, route selection
          - recipes.md: End-to-end examples combining customization seams, such as multi-tenant SaaS and username-based login
        Adapters:
          - adapters/index.md: Adapter architecture, choosing an adapter, custom schemas, and choosing a primary key type (UUID, int, str)
          - adapters/sqlmodel.md: SQLModel adapter setup with UserMixin fields, session configuration, table schema, custom schemas, and OAuth support
          - adapters/sqlalchemy.md: SQLAlchemy declarative adapter setup with user model, table creation, and custom schemas
          - adapters/tortoise.md: Tortoise ORM adapter with model mixins, Tortoise.init registration, real transactions, and custom schemas
          - adapters/beanie.md: Beanie (MongoDB) adapter with document classes, init_beanie, embedded roles/permissions, and single-document CAS atomicity
          - adapters/custom.md: Worked in-memory adapter example, key method contracts (revoke CAS, transaction, sign-count), and opting into features
        Authentication:
          - auth/dependencies.md: current_user, verified and superuser dependencies, current_token_payload, require_role, require_permission, typed dependencies
          - auth/sessions.md: List active sessions (refresh-token families), revoke one device, or sign out everywhere else
          - auth/hooks.md: Callbacks for auth events such as after_register, after_login, send_verification_email, after_oauth_login
          - auth/custom-claims.md: Embed app-specific data in JWTs via on_create_token_claims, read through payload.extra
          - auth/passwords.md: Custom password rules, hashing algorithms, and transparent rehashing
          - passkeys.md: WebAuthn passwordless login; registration and authentication flows, clone detection, frontend integration
          - oauth.md: Google, GitHub, Discord, and GitLab OAuth setup, authorization flow, auto-linking by email, unlinking, custom providers
        Security:
          - security/rate-limiting.md: Per-route auth limits and global IP-based rate limiting with memory or Redis backends
          - security/middleware.md: Security headers and CSRF double-submit cookie protection, added with app.add_middleware
          - security/threat-model.md: What the library defends against, its trust assumptions, failure modes, and what remains the application's responsibility
        Operations:
          - frontend-integration.md: Wiring auth into a frontend; token storage, refresh handling, and protected requests
          - migrations.md: Alembic env.py wiring with your project's metadata and opt-in tables via mixin subclassing
          - testing.md: Testing apps built with fastapi-fullauth; fixtures, overriding dependencies, asserting auth behavior
          - troubleshooting.md: Common errors and warnings mapped to fixes
          - api-reference.md: FullAuth, FullAuthConfig, types, dependencies, exceptions, and utilities
          - contributing.md: Development setup, testing, linting, and contribution guidelines

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Configuration: configuration.md
  - Customization: customization.md
  - Recipes: recipes.md
  - Adapters:
      - Overview: adapters/index.md
      - SQLModel: adapters/sqlmodel.md
      - SQLAlchemy: adapters/sqlalchemy.md
      - Tortoise ORM: adapters/tortoise.md
      - Beanie (MongoDB): adapters/beanie.md
      - Custom Adapters: adapters/custom.md
  - Authentication:
      - Protected Routes: auth/dependencies.md
      - Session Management: auth/sessions.md
      - Event Hooks: auth/hooks.md
      - Custom Token Claims: auth/custom-claims.md
      - Password Validation: auth/passwords.md
  - Passkeys (WebAuthn): passkeys.md
  - OAuth2 Social Login: oauth.md
  - Security:
      - Rate Limiting: security/rate-limiting.md
      - Middleware: security/middleware.md
      - Threat Model: security/threat-model.md
  - Frontend Integration: frontend-integration.md
  - Database Migrations: migrations.md
  - Testing: testing.md
  - Troubleshooting: troubleshooting.md
  - API Reference: api-reference.md
  - Contributing: contributing.md
